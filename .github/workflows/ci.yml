name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tesseract (English + Indic scripts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-hin tesseract-ocr-ben tesseract-ocr-guj \
            tesseract-ocr-kan tesseract-ocr-mar tesseract-ocr-pan tesseract-ocr-tam tesseract-ocr-tel

      - name: Install a Devanagari font (best-effort — Hindi rendering tests skip gracefully without it)
        run: sudo apt-get install -y --no-install-recommends fonts-noto-devanagari || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app tests

      - name: Run tests
        working-directory: backend
        run: pytest -q

      - name: Verify the app actually starts
        working-directory: backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 3
          curl -sf http://127.0.0.1:8000/api/health
          curl -sf http://127.0.0.1:8000/api/readiness
